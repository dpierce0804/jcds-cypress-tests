name: Cypress Smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 7 * * 1-5'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      browser:
        description: Browser
        type: choice
        options: [chrome, firefox, electron]
        default: chrome
permissions:
  contents: read
concurrency:
  group: cypress-smoke-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CYPRESS_BASE_URL: ${{ vars.BASE_URL || 'https://jaxencreekdroneservices.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run smoke tests
        uses: cypress-io/github-action@v7
        with:
          build: npm run typecheck
          wait-on: ${{ vars.BASE_URL || 'https://jaxencreekdroneservices.com' }}
          command: npm run test:smoke -- --browser ${{ inputs.browser || 'chrome' }}
      - name: Save JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/junit/
          retention-days: 7
          if-no-files-found: ignore
      - name: Save failure screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-media-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cypress/screenshots/
            cypress/videos/
          retention-days: 3
          if-no-files-found: ignore
      - name: Send results to Slack
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_STATUS: ${{ job.status }}
        run: node scripts/notify-slack.mjs
